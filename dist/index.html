function about(){return `${head('Project Overview','About the Project','The purpose, progress and evidence behind ALS HybriNet 360.','Capstone 1 · proposal and implementation')}
<section class="about-hero"><div><div class="about-kicker">Background Information</div><h2>A Hybrid Deep Learning Framework For AI Driven Molecular Diagnostics In Rare Diseases Detection</h2><p>Rare diseases affect more than 300 million people worldwide, yet diagnosis can remain slow and uncertain because symptoms overlap, molecular evidence is complex, and genomic, transcriptomic, proteomic and clinical information is often reviewed separately. This project investigates whether complementary AI models can bring those signals together into a faster, more interpretable research workflow.</p><div class="status-row"><span class="pill live">ALS case study demonstrated</span><span class="pill plan">Multi-omics target architecture</span><span class="pill demo">Research prototype</span></div></div><div class="about-meta"><div><span>Name</span><b>Ashish Shrivastav</b></div><div><span>Program</span><b>MSc in Artificial Intelligence · AI-08</b></div><div><span>Institution</span><b>REVA Academy for Corporate Excellence</b></div></div></section>
<section class="grid two about-section"><div class="card about-card"><div class="section-tag">Project Objectives</div><h2>What is the goal?</h2><p class="goal-callout">Develop an explainable CNN + RNN + attention framework that can combine molecular and longitudinal clinical evidence to support accurate rare-disease detection.</p><div class="study-list"><div class="study-item"><div class="study-no">01</div><div><h3>Integrate complementary models</h3><p>Use CNNs for high-dimensional molecular patterns, RNNs for temporal clinical trends, and attention for patient-level feature and modality prioritisation.</p></div></div><div class="study-item"><div class="study-no">02</div><div><h3>Identify useful biomarkers</h3><p>Analyse genomics, transcriptomics and proteomics to identify disease-associated molecular signatures.</p></div></div><div class="study-item"><div class="study-no">03</div><div><h3>Measure diagnostic performance</h3><p>Evaluate accuracy, precision, recall, F1-score and AUC across stratified rare-disease datasets.</p></div></div><div class="study-item"><div class="study-no">04</div><div><h3>Enhance explainability and clinical applicability</h3><p>Use attention visualisation and SHAP-style attribution to improve explainability and clinical relevance.</p></div></div></div></div>
<div class="card about-card"><div class="section-tag">Current Status</div><h2>What have we built?</h2><p>An end-to-end ALS research prototype that connects data preparation, model evaluation, biomarker interpretation and a 360-degree dashboard. ALS serves as the current rare-disease case study for testing the proposed framework.</p><div class="evidence-strip"><div class="evidence-item"><b>356</b><span>participants in the demonstrated cohort</span></div><div class="evidence-item"><b>1,838</b><span>shared circulating miRNA features</span></div><div class="evidence-item"><b>22</b><span>longitudinal profiles</span></div><div class="evidence-item"><b>0.862</b><span>repeated CV AUROC ± 0.013</span></div></div><div class="about-note" style="margin-top:16px"><b>Current evidence:</b> the notebook demonstrates a reproducible ALS classification pipeline using public GEO miRNA data, patient-level splitting, fold-safe preprocessing, model comparison, held-out evaluation and feature attribution. The dashboard also presents the intended integrated genomics, proteomics and clinical workspace; those linked multi-omics records are representative until a matched cohort is connected.</div><div class="status-row"><span class="pill live">Data pipeline</span><span class="pill live">Model evaluation</span><span class="pill live">Feature attribution</span><span class="pill plan">Matched multi-omics cohort</span></div></div></section>
<section class="card about-card about-section"><div class="section-tag">Project Methodology · Flow Chart</div><h2>How does the system work?</h2><p>Public molecular datasets are quality checked, normalised and selected before modality-specific learning. The target model fuses the learned representations and returns a research prediction with interpretable evidence.</p><div class="flow-steps"><div class="flow-step"><b>01</b><strong>Data Collection</strong><span>NCBI/GEO molecular and clinical datasets</span></div><div class="flow-step"><b>02</b><strong>Data Pre-processing</strong><span>Quality control, normalisation and feature selection</span></div><div class="flow-step"><b>03</b><strong>Feature Extraction</strong><span>CNN molecular features and RNN clinical sequences</span></div><div class="flow-step"><b>04</b><strong>Feature Fusion</strong><span>Attention weights across patient evidence</span></div><div class="flow-step"><b>05</b><strong>Model Evaluation</strong><span>Accuracy, precision, recall, F1 and AUC</span></div><div class="flow-step"><b>06</b><strong>Explainability</strong><span>Biomarkers, SHAP and attention views</span></div></div></section>
<section class="grid two about-section"><div class="card about-card"><div class="section-tag">Literature Review</div><h2>What have we studied so far?</h2><p>The literature review examined how AI is currently used in rare-disease diagnosis, prognosis and drug discovery, and where existing approaches remain incomplete.</p><div class="study-list"><div class="study-item"><div class="study-no">A</div><div><h3>Rare genetic disease diagnosis and prognosis</h3><p>Supervised learning improves variant prioritisation, but most reported studies use genomic data alone and miss cross-modal evidence.</p></div></div><div class="study-item"><div class="study-no">B</div><div><h3>Recent AI advances in rare diseases</h3><p>Diagnosis, drug repurposing and decision support show promise, while limited interpretability, prognostic coverage and real-world adoption remain barriers.</p></div></div><div class="study-item"><div class="study-no">C</div><div><h3>AI-assisted therapeutic discovery</h3><p>AI can accelerate target identification, but drug-discovery studies do not directly solve early diagnostic integration.</p></div></div><div class="study-item"><div class="study-no">D</div><div><h3>Diagnosis and personalised treatment</h3><p>Existing tools improve speed within genomic or therapeutic silos, leaving multi-modal fusion and ethical safeguards underdeveloped.</p></div></div></div></div>
<div class="card about-card"><div class="section-tag">Problem Statement</div><h2>What problem are we addressing?</h2><p>Current rare-disease workflows can be lengthy, costly and prone to misdiagnosis. Many AI systems analyse only one data type, provide limited explanation and are rarely tested in real clinical settings. The project responds with one interpretable workflow for molecular patterns, temporal phenotype and cross-modal interaction.</p><div class="impact-grid"><div class="impact"><b>For researchers</b><p>Explore molecular signatures, model comparisons and reproducible evidence.</p></div><div class="impact"><b>For clinicians and reviewers</b><p>Inspect why a model produced a score and which evidence contributed.</p></div><div class="impact"><b>For patients and health systems</b><p>Support future work toward shorter diagnostic journeys and more focused investigation.</p></div></div><div class="about-note" style="margin-top:16px"><b>Proposed Solution:</b> a scalable, cloud-ready research framework that can improve diagnostic accuracy, speed and interpretability, support precision-medicine studies and integrate with clinical systems after appropriate validation.</div></div></section>
<section class="grid two about-section"><div class="card about-card"><div class="section-tag">Detailed Scope of Work</div><h2>What can the application do today?</h2><p><b>Available:</b> explore the demonstrated ALS cohort, inspect patient-style profiles, compare molecular signals, replay the target architecture, review feature attribution, examine validation metrics and trace data provenance.</p><p style="margin-top:12px"><b>In progress:</b> connection of patient-matched genomic, transcriptomic, proteomic and longitudinal clinical datasets; external cohort validation; calibrated uncertainty; and clinical-system integration.</p><div class="about-note" style="margin-top:16px">Research and educational demonstration. This application is not a standalone diagnostic system, does not provide treatment recommendations and has not received regulatory approval. Attention and feature attributions explain model behaviour; they do not prove biological causation.</div></div><div class="card about-card"><div class="section-tag">References</div><h2>References</h2><div class="reference-list"><div>Roman-Naranjo, Parra-Perez and Lopez-Escamez (2023). A systematic review on machine-learning approaches in the diagnosis and prognosis of rare genetic diseases. <i>Journal of Biomedical Informatics, 143</i>, 104429.</div><div>Warudkar et al. (2024). Artificial intelligence in rare diseases: A review of recent advances in diagnosis and treatment. <i>AIP Conference Proceedings</i>.</div><div>Suresh, Kaliappan, Ali and Kumar (2024). AI-driven drug discovery and therapeutic target identification for rare genetic diseases. <i>ASSIC, IEEE</i>.</div><div>Abdallah et al. (2023). The impact of artificial intelligence on optimising diagnosis and treatment plans for rare genetic disorders. <i>Cureus, 15(10)</i>.</div><div>Faviez et al. (2020). Diagnosis support systems for rare diseases: a scoping review. <i>Orphanet Journal of Rare Diseases, 15</i>.</div></div></div></section>`}

about=()=>`${head('Project Overview','About the Project','The purpose, progress and notebook evidence behind ALS HybriNet 360.','Capstone 1 · final research application')}<section class="about-hero"><div><div class="about-kicker">Background Information</div><h2>A Hybrid Deep Learning Framework For AI Driven Molecular Diagnostics In Rare Diseases Detection</h2><p>Rare diseases affect more than 300 million people worldwide. This project studies an explainable hybrid deep-learning approach for combining molecular patterns and longitudinal evidence, using ALS as the implemented rare-disease case study.</p><div class="status-row"><span class="pill live">Executed ALS study</span><span class="pill scope">CNN + RNN + attention</span><span class="pill result">Notebook-derived results</span></div></div><div class="about-meta"><div><span>Name</span><b>Ashish Shrivastav</b></div><div><span>Program</span><b>MSc in Artificial Intelligence · AI-08</b></div><div><span>Institution</span><b>REVA Academy for Corporate Excellence</b></div></div></section><section class="grid two about-section"><div class="card about-card"><div class="section-tag">Project Objectives</div><h2>What is the goal?</h2><p class="goal-callout">Develop an explainable CNN + RNN + attention framework for rare-disease molecular diagnostics.</p><div class="study-list"><div class="study-item"><div class="study-no">01</div><div><h3>Hybrid learning</h3><p>Use convolutional learning for molecular patterns, recurrent learning for real longitudinal sequences and attention for fusion.</p></div></div><div class="study-item"><div class="study-no">02</div><div><h3>Biomarker interpretation</h3><p>Rank disease-associated molecular features with development-only SHAP analysis.</p></div></div><div class="study-item"><div class="study-no">03</div><div><h3>Diagnostic evaluation</h3><p>Compare the proposed network with six conventional baselines using cross-validation and a held-out test set.</p></div></div><div class="study-item"><div class="study-no">04</div><div><h3>Explainable outputs</h3><p>Report global and patient-level attribution, modality attention and temporal attention.</p></div></div></div></div><div class="card about-card"><div class="section-tag">Current Status</div><h2>What have we built?</h2><p>The executed notebook implements ALS-HybriNet v3: a 1-D CNN over family-ordered baseline miRNA, a GRU over genuine repeated miRNA visits, a missing-modality mask and attention-based fusion.</p><div class="evidence-strip"><div class="evidence-item"><b>356</b><span>baseline patients</span></div><div class="evidence-item"><b>1,838</b><span>shared miRNAs</span></div><div class="evidence-item"><b>22</b><span>longitudinal patients</span></div><div class="evidence-item"><b>0.8624</b><span>CV ROC-AUC</span></div></div><div class="about-note result-note" style="margin-top:16px"><b>Executed evidence:</b> patient-level splitting, fold-specific preprocessing, three hyperparameter configurations, six baselines, 15-fold repeated validation, one frozen held-out evaluation, Gradient SHAP on 150 development patients, modality attention and four architecture ablations.</div></div></section><section class="card about-card about-section"><div class="section-tag">Project Methodology · Flow Chart</div><h2>How does the system work?</h2><div class="flow-steps"><div class="flow-step"><b>01</b><strong>Data Collection</strong><span>Four GSE168714 files from GEO</span></div><div class="flow-step"><b>02</b><strong>Data Pre-processing</strong><span>Patient split, filter, scale and family order</span></div><div class="flow-step"><b>03</b><strong>Feature Extraction</strong><span>512 miRNAs per fold for CNN input</span></div><div class="flow-step"><b>04</b><strong>Sequence Learning</strong><span>GRU over up to four genuine visits</span></div><div class="flow-step"><b>05</b><strong>Attention Fusion</strong><span>Masked CNN and RNN modality weights</span></div><div class="flow-step"><b>06</b><strong>Evaluation</strong><span>CV, held-out test, SHAP and ablation</span></div></div></section><section class="grid two about-section"><div class="card about-card"><div class="section-tag">Literature Review</div><h2>What have we studied so far?</h2><p>Prior work shows that AI improves variant prioritisation, phenotype-genotype mapping and drug-target discovery, but frequently studies isolated data types, provides limited interpretability and lacks real-world validation. This motivated a combined molecular, temporal and explainability workflow.</p></div><div class="card about-card"><div class="section-tag">Problem Statement</div><h2>What problem are we addressing?</h2><p>Rare-disease diagnosis remains lengthy and costly because biological evidence is high-dimensional and clinical expression varies. ALS-HybriNet tests whether complementary neural branches and transparent evaluation can improve molecular classification while making the evidence inspectable.</p><div class="about-note warning-note" style="margin-top:16px"><b>Study boundary:</b> GSE168714 supplies baseline miRNA for all patients and longitudinal miRNA for 22 ALS patients. It does not provide patient-matched genomics, proteomics or repeated clinical measures. The implemented multimodal fusion is therefore baseline plus longitudinal miRNA.</div></div></section><section class="grid two about-section"><div class="card about-card"><div class="section-tag">Proposed Solution</div><h2>Research contribution</h2><p>A leakage-aware CNN + GRU + attention pipeline, evaluated beside six baselines and explained through Gradient SHAP and attention analysis. The application makes every reported notebook table accessible for review.</p></div><div class="card about-card"><div class="section-tag">References</div><h2>References</h2><div class="reference-list"><div>Roman-Naranjo, Parra-Perez and Lopez-Escamez (2023). <i>Journal of Biomedical Informatics, 143</i>, 104429.</div><div>Warudkar et al. (2024). <i>Artificial intelligence in rare diseases</i>. AIP Conference Proceedings.</div><div>Suresh et al. (2024). <i>AI-driven drug discovery and therapeutic target identification</i>. IEEE ASSIC.</div><div>Abdallah et al. (2023). <i>Cureus, 15(10)</i>.</div><div>Faviez et al. (2020). <i>Orphanet Journal of Rare Diseases, 15</i>.</div></div></div></section>`;

timeline=()=>`${head('Temporal modelling','Longitudinal Analysis','Inspect the genuine repeated-visit data used by the RNN branch and the attention behaviour reported by the notebook.','GSE168714 longitudinal subset')}<section class="grid kpis"><div class="card kpi"><div class="kpi-label">Longitudinal patients</div><div class="kpi-value">22</div><div class="kpi-note">Unique ALS patients</div></div><div class="card kpi"><div class="kpi-label">Maximum visits</div><div class="kpi-value">4</div><div class="kpi-note">Time-ordered observations</div></div><div class="card kpi"><div class="kpi-label">Shared sequence features</div><div class="kpi-value">1,838</div><div class="kpi-note">miRNAs aligned to baseline</div></div><div class="card kpi"><div class="kpi-label">ALS coverage</div><div class="kpi-value">8.7%</div><div class="kpi-note">22 of 253 ALS patients</div></div></section><section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>RNN data path</h2><p>Executed sequence-processing design</p></div></div><div class="timeline"><div class="visit"><time>Step 1</time><strong>Identify genuine repeated samples</strong><p>Each sequence is grouped by patient and ordered by recorded visit.</p></div><div class="visit"><time>Step 2</time><strong>Apply fold-fit transformation</strong><p>Sequence features use parameters learned only from training patients.</p></div><div class="visit"><time>Step 3</time><strong>Encode with a GRU</strong><p>Real visit counts create the sequence mask; no artificial time steps are added.</p></div><div class="visit"><time>Step 4</time><strong>Fuse when present</strong><p>The missing-modality mask sets RNN weight to zero for patients without longitudinal data.</p></div></div></div><div class="card panel"><div class="panel-head"><div><h2>Mean modality attention</h2><p>Grouped by longitudinal-data availability</p></div><span class="pill result">Notebook Table 11</span></div>${table(['RNN data present','CNN weight','RNN weight'],[['False',1,0],['True',.0083,.9917]])}<div class="insight warning-note" style="margin-top:16px"><b>Interpret carefully</b><br>Only ALS patients have longitudinal data, so branch availability is perfectly confounded with the label. The 0.9917 RNN weight may partly reflect presence of the branch rather than sequence content alone.</div></div></section>`;

diagnostics=()=>`${head('Proposed architecture','Model Architecture','Inspect the implemented CNN + RNN + attention network and selected training configuration.','ALS-HybriNet v3 · executed model')}<section class="card panel"><div class="panel-head"><div><h2>CNN + RNN + attention pipeline</h2><p>Architecture implemented in notebook Block 7</p></div><span class="pill live">Implemented</span></div><div class="pipeline"><div class="branch-stack"><div class="node selected" data-node="CNN molecular encoder"><span class="tag">CNN</span><small>BASELINE BRANCH</small><strong>Family-ordered miRNA</strong><p>Conv1D channels 24 and 48, kernel size 7, pooling, GELU and dropout 0.30.</p></div><div class="node" data-node="RNN sequence encoder"><span class="tag">GRU</span><small>LONGITUDINAL BRANCH</small><strong>Repeated miRNA visits</strong><p>GRU over up to four real visits with visit masking and temporal attention.</p></div></div><div class="arrow">→</div><div class="node" data-node="Attention fusion"><span class="tag">ATTN</span><small>FUSION</small><strong>Masked modality attention</strong><p>Combines 48-dimensional branch embeddings and sets absent RNN inputs to zero weight.</p></div><div class="arrow">→</div><div class="node" data-node="ALS classifier"><span class="tag">OUTPUT</span><small>CLASSIFIER</small><strong>ALS probability</strong><p>Frozen out-of-fold threshold: 0.6942.</p></div></div></section><section class="grid two" style="margin-top:16px"><div class="card panel"><div class="panel-head"><div><h2>Selected configuration</h2><p>H1 base · median best epoch 11 · final epoch 13</p></div></div><div class="clinical-list"><div class="clinical-item"><span>CNN embedding</span><b>48</b></div><div class="clinical-item"><span>Convolution channels</span><b>24, 48</b></div><div class="clinical-item"><span>Kernel size</span><b>7</b></div><div class="clinical-item"><span>Dropout</span><b>0.30</b></div><div class="clinical-item"><span>Selected features</span><b>512 / fold</b></div><div class="clinical-item"><span>Final ensemble</span><b>5 seeds</b></div></div></div><div class="card panel"><div class="panel-head"><div><h2>Hyperparameter search</h2><p>Repeated development cross-validation</p></div></div>${table(['Configuration','CV ROC-AUC','SD','PR-AUC','Median epoch'],hpRows)}</div></section>`;

explain=()=>`${head('Explainability results','Explainability','Review population-level SHAP, patient-level SHAP and learned modality weights.','Notebook Tables 09–11')}<section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>Global CNN attribution</h2><p>Leading miRNAs by mean absolute Gradient SHAP value</p></div><span class="pill result">150 patients</span></div><div class="feature-list">${topMirna.slice(0,12).map(([n,,v])=>`<div class="feature"><span class="mono">${n} <small class="muted">${v.toFixed(4)}</small></span><div class="track"><i style="width:${v/.0335*100}%"></i></div></div>`).join('')}</div></div><div class="card panel"><div class="panel-head"><div><h2>Patient-level SHAP</h2><p>Five features × five notebook example patients</p></div></div>${table(['Patient','Rank','miRNA','Attribution'],Object.entries(patientShap).flatMap(([id,rs])=>rs.map((r,i)=>[id,i+1,r[0],r[1]])))}</div></section><section class="grid two" style="margin-top:16px"><div class="card panel"><div class="panel-head"><div><h2>Modality attention</h2><p>Mean weight by sequence availability</p></div></div>${table(['Longitudinal present','CNN','RNN'],[['No',1,0],['Yes',.0083,.9917]])}</div><div class="card panel"><div class="panel-head"><div><h2>Interpretation</h2><p>What these outputs support</p></div></div><div class="insight result-note"><b>Strongest global attribution</b><br>hsa-miR-206 has mean absolute attribution 0.0335, followed by hsa-miR-2276-5p at 0.0195 and hsa-miR-484 at 0.0191.</div><div class="insight warning-note" style="margin-top:12px">SHAP and attention explain model behaviour. They are not causal biomarker validation, and modality attention is affected by the cohort’s ALS-only longitudinal availability.</div></div></section>`;

validation=()=>`${head('Evaluation results','Model Validation','All performance, statistical comparison and ablation data reported by the executed notebook.','Notebook Tables 04–08 and 12')}<section class="grid kpis"><div class="card kpi"><div class="kpi-label">CV ROC-AUC</div><div class="kpi-value">0.8624</div><div class="kpi-note">± 0.0133 · 15 folds</div></div><div class="card kpi"><div class="kpi-label">Held-out ROC-AUC</div><div class="kpi-value">0.9057</div><div class="kpi-note">95% CI 0.830–0.965</div></div><div class="card kpi"><div class="kpi-label">Held-out PR-AUC</div><div class="kpi-value">0.9660</div><div class="kpi-note">72 test patients</div></div><div class="card kpi"><div class="kpi-label">Held-out MCC</div><div class="kpi-value">0.6145</div><div class="kpi-note">Frozen threshold 0.6942</div></div></section><div class="section-stack"><section class="card panel"><div class="panel-head"><div><h2>Internal cross-validated performance</h2><p>Out-of-fold metrics on the development cohort</p></div><span class="pill result">Table 06</span></div>${table(['Rank','Model','ROC-AUC','SD','PR-AUC','Bal. acc.','Sensitivity','Specificity','F1','MCC','Threshold'],cvRows)}</section><section class="card panel"><div class="panel-head"><div><h2>Held-out test performance</h2><p>Models and thresholds frozen before scoring</p></div><span class="pill result">Table 07</span></div>${table(['Rank','Model','ROC-AUC','95% CI','PR-AUC','Bal. acc.','Sensitivity','Specificity','F1','MCC','Brier','ECE'],testRows)}</section><section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>Selected baseline configurations</h2><p>Development cross-validation</p></div><span class="pill result">Table 04</span></div>${table(['Model','Selected parameter','ROC-AUC','SD','PR-AUC','Threshold'],baselineRows)}</div><div class="card panel"><div class="panel-head"><div><h2>Proposed-model search</h2><p>Three notebook configurations</p></div><span class="pill result">Table 05</span></div>${table(['Configuration','ROC-AUC','SD','PR-AUC','Median epoch'],hpRows)}</div></section><section class="card panel"><div class="panel-head"><div><h2>Paired DeLong comparisons</h2><p>ALS-HybriNet minus each baseline on the held-out set; Holm-adjusted conclusions were all non-significant</p></div><span class="pill result">Table 08</span></div>${table(['Comparison','AUC difference','z','p','Holm p'],delongRows)}</section><section class="card panel"><div class="panel-head"><div><h2>Ablation study</h2><p>First CV repeat and seed-ensemble test evaluation</p></div><span class="pill result">Table 12</span></div>${table(['Variant','CV ROC-AUC','Test ROC-AUC','Test PR-AUC','Test bal. acc.','Test specificity','Test MCC'],ablationRows)}</section><section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>ALS-HybriNet confusion matrix</h2><p>Held-out test set at threshold 0.6942</p></div></div><div class="cm"><div>19</div><div>2</div><div>12</div><div>39</div></div><div class="legend" style="justify-content:center;margin-top:10px"><span>TN 19</span><span>FP 2</span><span>FN 12</span><span>TP 39</span></div></div><div class="card panel"><div class="panel-head"><div><h2>Test composition</h2><p>Counts underlying the classification metrics</p></div></div><div class="clinical-list"><div class="clinical-item"><span>ALS</span><b>51</b></div><div class="clinical-item"><span>Controls</span><b>21</b></div><div class="clinical-item"><span>Correct</span><b>58 / 72</b></div><div class="clinical-item"><span>Errors</span><b>14 / 72</b></div></div></div></section><div class="insight warning-note"><b>Result interpretation:</b> the hybrid model ranked first on the single held-out test split but fifth in repeated internal CV. No held-out DeLong comparison remained significant after Holm correction; repeated CV is the headline performance estimate.</div></div>`;

research=()=>`${head('Research outputs','Results Library','A complete index of notebook-generated tables, figures and analysis stages.','ALS-HybriNet v3 · executed outputs')}<section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>Notebook tables</h2><p>Twelve exported result tables</p></div><span class="pill live">12 outputs</span></div>${[['01','Computational environment'],['02','GSE168714 cohort composition'],['03','Shared model-development design'],['04','Selected baseline configurations'],['05','Multimodal hyperparameter search'],['06','Internal CV comparison'],['07','Held-out test ranking'],['08','Paired DeLong tests'],['09','Top 30 miRNAs'],['10','Per-patient SHAP'],['11','Modality attention'],['12','Architecture ablation']].map(x=>`<div class="source-row"><div><strong>Table ${x[0]}</strong><span>${x[1]}</span></div><span class="pill result">Included</span></div>`).join('')}</div><div class="card panel"><div class="panel-head"><div><h2>Notebook figures</h2><p>Six generated research figures</p></div><span class="pill live">6 outputs</span></div>${[['01','Internal CV ROC and precision–recall'],['02','Held-out ROC and precision–recall'],['03','Held-out confusion matrices'],['04','CNN miRNA attribution'],['05','RNN per-visit attention'],['06','Architecture ablation']].map(x=>`<div class="source-row"><div><strong>Figure ${x[0]}</strong><span>${x[1]}</span></div><span class="pill result">Generated</span></div>`).join('')}</div></section><section class="grid three" style="margin-top:16px"><div class="card panel"><h2>Environment</h2><div class="clinical-list" style="margin-top:13px"><div class="clinical-item"><span>Python</span><b>3.13.15</b></div><div class="clinical-item"><span>NumPy</span><b>2.1.3</b></div><div class="clinical-item"><span>pandas</span><b>2.2.3</b></div><div class="clinical-item"><span>SciPy</span><b>1.16.3</b></div><div class="clinical-item"><span>scikit-learn</span><b>1.6.1</b></div><div class="clinical-item"><span>PyTorch</span><b>2.11 CUDA</b></div></div></div><div class="card panel"><h2>Development time</h2><div class="metric-row"><div class="mini-metric"><span>Baselines</span><b>1.3 min</b></div><div class="mini-metric"><span>Hybrid model</span><b>2.1 min</b></div><div class="mini-metric"><span>Final epoch</span><b>13</b></div></div></div><div class="card panel"><h2>Execution status</h2><div class="source-row"><div><strong>Data download</strong><span>Four GEO files present</span></div><span>Complete</span></div><div class="source-row"><div><strong>Model evaluation</strong><span>Seven models scored</span></div><span>Complete</span></div><div class="source-row"><div><strong>Explainability</strong><span>SHAP and attention reported</span></div><span>Complete</span></div></div></section>`;
presentation=()=>`${head('Presentation guide','Presentation & Viva Defence','A concise, evidence-based route through the project and the questions an examiner is likely to ask.','Final viva guide · ALS-HybriNet v3')}<section class="card script-card"><div class="section-tag">Opening statement</div><h2 style="font-size:1.25rem;margin:0 0 10px">Start with this explanation</h2><p>“My project proposes a hybrid deep-learning framework for rare-disease molecular diagnostics. For implementation and evaluation, I selected ALS as the rare-disease case study and used the public GSE168714 dataset. The implemented model combines a CNN for baseline miRNA patterns, a GRU-based RNN for genuine longitudinal miRNA sequences, and attention-based fusion. The system was evaluated using leakage-safe repeated cross-validation, a held-out test set, baseline comparisons, ablation experiments and Gradient SHAP explainability.”</p></section><section class="grid two" style="margin-top:16px"><div class="card about-card"><div class="section-tag">Presentation sequence</div><h2>What to present</h2><div class="study-list">${[['01','Problem','Rare-disease diagnosis is difficult because molecular evidence is high-dimensional, symptoms overlap and patient cohorts are small.'],['02','Objective','Combine CNN molecular learning, GRU longitudinal learning, attention fusion and explainability.'],['03','ALS case study','Use GSE168714: 356 patients, 1,838 shared miRNAs and 22 genuine longitudinal profiles.'],['04','Methodology','Patient split first, fold-safe preprocessing, 5 × 3 repeated CV, then one frozen held-out evaluation.'],['05','Architecture','1-D CNN + masked GRU + attention fusion + binary classifier.'],['06','Results','Lead with CV ROC-AUC 0.8624 ± 0.0133; then report held-out ROC-AUC 0.9057.'],['07','Explainability','Gradient SHAP on 150 development patients; hsa-miR-206 ranks first at 0.0335.'],['08','Conclusion','The core architecture was implemented; larger matched cohorts are required for broader multi-omics validation.']].map(x=>`<div class="study-item"><div class="study-no">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div></div><div class="section-stack"><div class="card about-card"><div class="section-tag">Numbers to quote</div><h2>Core results</h2><div class="clinical-list" style="margin-top:14px"><div class="clinical-item"><span>Cohort</span><b>253 ALS · 103 controls</b></div><div class="clinical-item"><span>Development / test</span><b>284 / 72</b></div><div class="clinical-item"><span>CV ROC-AUC</span><b>0.8624 ± 0.0133</b></div><div class="clinical-item"><span>CV PR-AUC</span><b>0.9481</b></div><div class="clinical-item"><span>Test ROC-AUC</span><b>0.9057</b></div><div class="clinical-item"><span>Test PR-AUC</span><b>0.9660</b></div><div class="clinical-item"><span>Sensitivity</span><b>0.7647</b></div><div class="clinical-item"><span>Specificity</span><b>0.9048</b></div><div class="clinical-item"><span>F1-score</span><b>0.8478</b></div><div class="clinical-item"><span>MCC</span><b>0.6145</b></div></div></div><div class="card about-card"><div class="section-tag">Closing statement</div><h2>Finish with this conclusion</h2><p>“The project successfully implements the core CNN, GRU and attention architecture through an ALS case study using genuine baseline and longitudinal molecular data. It provides a leakage-safe and explainable evaluation pipeline. The next research stage is validation using larger patient-matched molecular and clinical cohorts.”</p></div></div></section><section class="grid two" style="margin-top:16px"><div class="card about-card"><div class="section-tag">Defensible claims</div><h2>What you can claim</h2><div class="claim-list"><div class="claim good"><i>✓</i><span>The notebook implements a CNN + GRU + attention model.</span></div><div class="claim good"><i>✓</i><span>The RNN uses genuine repeated miRNA visits for 22 ALS patients.</span></div><div class="claim good"><i>✓</i><span>Patient-level splitting and fold-specific preprocessing reduce leakage risk.</span></div><div class="claim good"><i>✓</i><span>The hybrid model achieved CV ROC-AUC 0.8624 ± 0.0133.</span></div><div class="claim good"><i>✓</i><span>SHAP and attention make the model’s behaviour inspectable.</span></div><div class="claim good"><i>✓</i><span>The ablation study supports combining CNN, RNN and attention in this experiment.</span></div></div></div><div class="card about-card"><div class="section-tag">Claims to avoid</div><h2>What you should not claim</h2><div class="claim-list"><div class="claim caution"><i>!</i><span>Do not say that patient-matched genomics and proteomics were used.</span></div><div class="claim caution"><i>!</i><span>Do not say the model is a clinically approved diagnostic system.</span></div><div class="claim caution"><i>!</i><span>Do not say it significantly outperformed every baseline.</span></div><div class="claim caution"><i>!</i><span>Do not describe attention or SHAP as proof of biological causation.</span></div><div class="claim caution"><i>!</i><span>Do not treat the single held-out ranking as more reliable than repeated CV.</span></div><div class="claim caution"><i>!</i><span>Do not claim the current dataset represents every rare disease.</span></div></div></div></section><section class="card about-card" style="margin-top:16px"><div class="section-tag">Likely examiner questions</div><h2>Viva defence answers</h2><details class="viva" open><summary>Is this actually a multi-omics implementation?</summary><p>The approved proposal defines the wider multi-omics framework. The executed ALS study validates the core multimodal principle using two genuine molecular streams: baseline miRNA and longitudinal miRNA. Patient-matched genomics and proteomics were not available in GSE168714, and no artificial modalities were created.</p></details><details class="viva"><summary>Why did Logistic Regression perform better in cross-validation?</summary><p>The dataset is relatively small and high-dimensional, where regularised linear models are strong. Logistic L2 achieved CV ROC-AUC 0.9070, compared with 0.8624 for ALS-HybriNet. The hybrid network additionally evaluates genuine temporal modelling, missing-modality handling, attention fusion and patient-level explanation.</p></details><details class="viva"><summary>Why should the held-out result be trusted?</summary><p>The held-out set was untouched until all models and thresholds were frozen, so it is an independent evaluation. However, it contains only 72 patients. The ROC-AUC was 0.9057 with a 95% interval of 0.830–0.965, so the repeated CV result remains the headline estimate.</p></details><details class="viva"><summary>Did the hybrid model significantly outperform the baselines?</summary><p>No held-out DeLong comparison remained significant after Holm correction. The nearest comparison was against Logistic L2 with an unadjusted p-value of 0.0089 and Holm-adjusted p-value of 0.0534. The correct conclusion is promising held-out performance without confirmed statistical superiority.</p></details><details class="viva"><summary>What does the ablation study show?</summary><p>The full model achieved CV ROC-AUC 0.8803 and test ROC-AUC 0.9141 in the ablation experiment, compared with 0.8459 and 0.8515 for CNN only, 0.5412 and 0.4178 for RNN only, and 0.8532 and 0.8842 for CNN plus RNN without attention.</p></details><details class="viva"><summary>Can attention prove which modality is biologically important?</summary><p>No. When longitudinal data were present, mean RNN attention was 0.9917, but only ALS patients had longitudinal records. Branch presence is therefore confounded with the label. Attention describes model weighting and is not causal evidence.</p></details><details class="viva"><summary>What is the main explainability finding?</summary><p>Gradient SHAP was computed for 150 development patients. hsa-miR-206 ranked first with mean absolute attribution 0.0335, followed by hsa-miR-2276-5p at 0.0195 and hsa-miR-484 at 0.0191. These are model-attribution findings that require biological validation.</p></details><details class="viva"><summary>Can the application diagnose a patient now?</summary><p>No. It is a research application for architecture evaluation, molecular classification and explainability. Clinical deployment would require independent external cohorts, prospective validation, calibration analysis, clinical governance and regulatory review.</p></details></section>`;
presentation=()=>`${head('Research summary','Project Narrative','A structured account of the research problem, implemented methodology, experimental evidence and interpretation.','ALS-HybriNet v3 · research narrative')}<section class="card script-card"><div class="section-tag">Project Overview</div><h2 style="font-size:1.25rem;margin:0 0 10px">Research Context</h2><p>ALS-HybriNet investigates a hybrid deep-learning framework for rare-disease molecular diagnostics. ALS is used as the implementation case study with the public GSE168714 dataset. The model combines a CNN for baseline miRNA patterns, a GRU-based RNN for genuine longitudinal miRNA sequences and attention-based fusion. Evaluation includes leakage-safe repeated cross-validation, a held-out test set, six conventional baselines, architecture ablation and Gradient SHAP explainability.</p></section><section class="grid two" style="margin-top:16px"><div class="card about-card"><div class="section-tag">Study Overview</div><h2>Research Journey</h2><div class="study-list">${[['01','Research Problem','Rare-disease diagnosis is difficult because molecular evidence is high-dimensional, symptoms overlap and available patient cohorts are often small.'],['02','Research Objective','Combine CNN molecular learning, GRU longitudinal learning, attention fusion and model explainability in one leakage-aware framework.'],['03','ALS Case Study','GSE168714 provides 356 baseline patients, 1,838 shared miRNAs and genuine longitudinal profiles for 22 ALS patients.'],['04','Experimental Methodology','Patients are split before preprocessing. Model development uses five-fold stratified cross-validation repeated three times, followed by one frozen held-out evaluation.'],['05','Model Architecture','A 1-D CNN encodes baseline miRNA, a masked GRU encodes repeated visits, and attention combines the available branch representations.'],['06','Performance Evaluation','The headline repeated CV ROC-AUC is 0.8624 ± 0.0133; held-out ROC-AUC is 0.9057 on 72 patients.'],['07','Explainability Analysis','Gradient SHAP is calculated on 150 development patients; hsa-miR-206 has the highest mean absolute attribution at 0.0335.'],['08','Research Outcome','The core architecture is implemented and evaluated; broader multi-omics validation requires larger patient-matched molecular and clinical cohorts.']].map(x=>`<div class="study-item"><div class="study-no">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div></div><div class="section-stack"><div class="card about-card"><div class="section-tag">Evaluation Summary</div><h2>Key Results</h2><div class="clinical-list" style="margin-top:14px"><div class="clinical-item"><span>Cohort</span><b>253 ALS · 103 controls</b></div><div class="clinical-item"><span>Development / test</span><b>284 / 72</b></div><div class="clinical-item"><span>CV ROC-AUC</span><b>0.8624 ± 0.0133</b></div><div class="clinical-item"><span>CV PR-AUC</span><b>0.9481</b></div><div class="clinical-item"><span>Test ROC-AUC</span><b>0.9057</b></div><div class="clinical-item"><span>Test PR-AUC</span><b>0.9660</b></div><div class="clinical-item"><span>Sensitivity</span><b>0.7647</b></div><div class="clinical-item"><span>Specificity</span><b>0.9048</b></div><div class="clinical-item"><span>F1-score</span><b>0.8478</b></div><div class="clinical-item"><span>MCC</span><b>0.6145</b></div></div></div><div class="card about-card"><div class="section-tag">Conclusion</div><h2>Conclusion</h2><p>The study implements the core CNN, GRU and attention architecture through an ALS case study using genuine baseline and longitudinal molecular data. It establishes a leakage-aware and explainable evaluation pipeline. The next research stage is validation with larger patient-matched molecular and clinical cohorts.</p></div></div></section><section class="grid two" style="margin-top:16px"><div class="card about-card"><div class="section-tag">Experimental Evidence</div><h2>Evidence Established by the Study</h2><div class="claim-list"><div class="claim good"><i>✓</i><span>The notebook implements a CNN + GRU + attention architecture.</span></div><div class="claim good"><i>✓</i><span>The RNN processes genuine repeated miRNA visits from 22 ALS patients.</span></div><div class="claim good"><i>✓</i><span>Patient-level splitting and fold-specific preprocessing reduce data-leakage risk.</span></div><div class="claim good"><i>✓</i><span>ALS-HybriNet achieved repeated CV ROC-AUC 0.8624 ± 0.0133.</span></div><div class="claim good"><i>✓</i><span>Gradient SHAP and attention provide inspectable model behaviour.</span></div><div class="claim good"><i>✓</i><span>The ablation experiment supports the combined architecture within this dataset.</span></div></div></div><div class="card about-card"><div class="section-tag">Scientific Interpretation</div><h2>Research Scope and Boundaries</h2><div class="claim-list"><div class="claim caution"><i>1</i><span><b>Data modalities:</b> the executed dataset contains baseline and longitudinal miRNA; it does not contain patient-matched genomics and proteomics.</span></div><div class="claim caution"><i>2</i><span><b>Intended use:</b> the model is a research system and has not undergone clinical or regulatory validation.</span></div><div class="claim caution"><i>3</i><span><b>Comparative performance:</b> statistical superiority over every baseline was not established after Holm correction.</span></div><div class="claim caution"><i>4</i><span><b>Explainability:</b> SHAP and attention describe model behaviour rather than biological causation.</span></div><div class="claim caution"><i>5</i><span><b>Evidence stability:</b> repeated cross-validation is more stable than the ranking from one held-out split.</span></div><div class="claim caution"><i>6</i><span><b>Generalisation:</b> the current evidence is specific to the GSE168714 ALS cohort.</span></div></div></div></section><section class="card about-card" style="margin-top:16px"><div class="section-tag">Methodological Considerations</div><h2>Technical Interpretation</h2><details class="viva" open><summary>Scope of the multimodal implementation</summary><p>The approved proposal defines a wider multi-omics framework. The executed ALS study validates the multimodal principle using two genuine molecular streams: baseline miRNA and longitudinal miRNA. Patient-matched genomics and proteomics were unavailable in GSE168714, so no artificial modalities were introduced.</p></details><details class="viva"><summary>Performance against conventional baselines</summary><p>The dataset is relatively small and high-dimensional, a setting in which regularised linear models are strong. Logistic L2 achieved CV ROC-AUC 0.9070, compared with 0.8624 for ALS-HybriNet. The hybrid network additionally evaluates temporal modelling, missing-modality handling, attention fusion and patient-level explanation.</p></details><details class="viva"><summary>Reliability of the held-out evaluation</summary><p>The held-out set remained untouched until models and thresholds were frozen, providing independent evaluation. It contains 72 patients, and the ROC-AUC of 0.9057 has a 95% confidence interval of 0.830–0.965. Repeated cross-validation therefore remains the headline estimate.</p></details><details class="viva"><summary>Statistical comparison</summary><p>No held-out DeLong comparison remained significant after Holm correction. The closest comparison was Logistic L2, with an unadjusted p-value of 0.0089 and Holm-adjusted p-value of 0.0534. The evidence supports promising held-out performance without confirmed statistical superiority.</p></details><details class="viva"><summary>Architecture contribution</summary><p>The full architecture achieved CV ROC-AUC 0.8803 and test ROC-AUC 0.9141 in the ablation experiment. CNN only achieved 0.8459 and 0.8515, RNN only achieved 0.5412 and 0.4178, and CNN plus RNN without attention achieved 0.8532 and 0.8842.</p></details><details class="viva"><summary>Interpretation of modality attention</summary><p>When longitudinal data were present, mean RNN attention was 0.9917. Because longitudinal records occur only for ALS patients, branch availability is confounded with the class label. The attention weights describe model allocation and cannot establish biological importance.</p></details><details class="viva"><summary>Explainability findings</summary><p>Gradient SHAP was computed for 150 development patients. hsa-miR-206 ranked first with mean absolute attribution 0.0335, followed by hsa-miR-2276-5p at 0.0195 and hsa-miR-484 at 0.0191. These findings require independent biological validation.</p></details><details class="viva"><summary>Clinical applicability</summary><p>The application supports architecture evaluation, molecular classification and explainability research. Clinical deployment would require independent external cohorts, prospective validation, calibration assessment, clinical governance and regulatory review.</p></details></section>`;
const views={about,presentation,overview,patient,cohort,omics,timeline,diagnostics,explain,validation,research,governance};
function render(){document.getElementById('content').innerHTML=views[state.view]();bind();window.scrollTo({top:0,behavior:'smooth'})}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function navigate(v){state.view=v;history.replaceState(null,'','#'+v);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('sidebar').classList.remove('open');render()}
function bind(){document.querySelectorAll('.jump').forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.querySelectorAll('[data-omic]').forEach(b=>b.onclick=()=>{state.omic=b.dataset.omic;render()});const gf=document.getElementById('groupFilter');if(gf)gf.onchange=()=>{const vals=gf.value==='als'?['253','253 ALS cases']:gf.value==='control'?['103','103 healthy controls']:['356','253 ALS · 103 controls'];document.getElementById('cohortN').textContent=vals[0];document.getElementById('cohortMix').textContent=vals[1]};['saveCohort','downloadTable','newExperiment'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=()=>showToast(id==='saveCohort'?'Cohort saved to workspace':id==='downloadTable'?'Biomarker table prepared':'New experiment created')});document.querySelectorAll('[data-node]').forEach(n=>n.onclick=()=>{document.querySelectorAll('[data-node]').forEach(x=>x.classList.remove('selected'));n.classList.add('selected');document.getElementById('nodeTitle').textContent=n.dataset.node});const run=document.getElementById('runAnalysis');if(run)run.onclick=()=>{const p=document.getElementById('runProgress'),l=document.getElementById('runLabel');run.disabled=true;p.className='run-progress running';l.textContent='Encoding available modalities…';setTimeout(()=>{p.className='run-progress done';l.textContent='Analysis complete · score '+patients[state.patient].risk+'%';run.disabled=false;showToast('Demonstration analysis complete')},1400)}}
document.querySelectorAll('#nav button[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('patientSelect').onchange=e=>{state.patient=e.target.value;if(['patient','timeline','diagnostics','explain'].includes(state.view))render();else showToast('Participant '+state.patient+' selected')};
document.getElementById('cohortSelect').onchange=e=>showToast(e.target.value+' selected');
document.getElementById('exportBtn').onclick=()=>window.print();
document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;if(q.toUpperCase().includes('MIR')||q.toUpperCase().includes('GENE')||q.toUpperCase().includes('NEFL'))navigate('omics');else if(q.toUpperCase().includes('AALS')||q.toUpperCase().includes('CTRL'))navigate('patient');else showToast('Search ready for “'+q+'”')}};
const initialView=location.hash.slice(1);if(views[initialView])state.view=initialView;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
render();
</script>
