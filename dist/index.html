<script>

 'AALS-0241':{group:'ALS · Limb onset',age:58,sex:'Male',visits:4,score:34,fvc:78,risk:82,progression:'Moderate',complete:'94%',gene:'C9ORF72',date:'18 Aug 2026'},
 'AALS-0187':{group:'ALS · Bulbar onset',age:64,sex:'Female',visits:5,score:28,fvc:66,risk:89,progression:'Fast',complete:'88%',gene:'SOD1',date:'02 Sep 2026'},
 'CTRL-0093':{group:'Healthy control',age:55,sex:'Female',visits:2,score:48,fvc:96,risk:14,progression:'Stable',complete:'76%',gene:'No flagged variant',date:'29 Jul 2026'}

function validation(){return `${head('Evidence & reproducibility','Model Validation','Compare discrimination, calibration and component contribution across the demonstrated experiment.','GSE168714 · demonstrated results')}<section class="grid kpis"><div class="card kpi"><div class="kpi-label">Repeated CV AUROC</div><div class="kpi-value">0.862</div><div class="kpi-note">± 0.013 · 15 folds</div></div><div class="card kpi"><div class="kpi-label">Held-out AUROC</div><div class="kpi-value">0.906</div><div class="kpi-note">95% CI 0.830–0.965</div></div><div class="card kpi"><div class="kpi-label">Held-out PR-AUC</div><div class="kpi-value">0.966</div><div class="kpi-note">ALS prevalence 70.8%</div></div><div class="card kpi"><div class="kpi-label">Balanced accuracy</div><div class="kpi-value">0.835</div><div class="kpi-note">Threshold fixed from development</div></div></section><section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>Cross-validated model comparison</h2><p>Development performance using fold-safe preprocessing</p></div><span class="pill live">Demonstrated</span></div><div class="model-rank">${[['Logistic L2',90.7],['Logistic L1',89.18],['Linear SVM',88.82],['RBF SVM',86.78],['HybriNet v3',86.24],['Extra Trees',84.81],['Random Forest',84.17]].map(([n,v])=>`<div class="rank-row ${n.includes('Hybri')?'proposed':''}"><span>${n}</span><div class="bar"><span style="width:${v}%"></span></div><b>${(v/100).toFixed(3)}</b></div>`).join('')}</div></div><div class="card panel"><div class="panel-head"><div><h2>Held-out confusion matrix</h2><p>72 participants · frozen OOF threshold</p></div></div><div class="cm"><div>19</div><div>2</div><div>12</div><div>39</div></div><div class="legend" style="justify-content:center;margin-top:10px"><span>Rows: actual</span><span>Columns: predicted</span></div><div class="metric-row"><div class="mini-metric"><span>Sensitivity</span><b>0.765</b></div><div class="mini-metric"><span>Specificity</span><b>0.905</b></div><div class="mini-metric"><span>MCC</span><b>0.615</b></div></div></div></section><section class="grid two" style="margin-top:16px"><div class="card panel"><div class="panel-head"><div><h2>Ablation study</h2><p>Contribution of the architecture components</p></div></div><table class="gene-table"><thead><tr><th>Variant</th><th>CV AUROC</th><th>Test AUROC</th></tr></thead><tbody><tr><td><b>Full CNN + RNN + attention</b></td><td>0.880</td><td>0.914</td></tr><tr><td>CNN only</td><td>0.846</td><td>0.852</td></tr><tr><td>RNN only</td><td>0.541</td><td>0.418</td></tr><tr><td>CNN + RNN, concatenated</td><td>0.853</td><td>0.884</td></tr></tbody></table></div><div class="card panel"><div class="panel-head"><div><h2>Evidence note</h2><p>How to read the result</p></div></div><div class="insight"><b>Primary evidence</b><br>Repeated cross-validation provides the most stable performance estimate. The higher held-out score comes from one 72-person split and did not establish statistical superiority over every baseline.</div><div class="source-row"><div><strong>Patient-level split</strong><span>No participant crosses development and test sets</span></div><span class="pill live">Pass</span></div><div class="source-row"><div><strong>Fold-safe preprocessing</strong><span>Selection and scaling refit in every fold</span></div><span class="pill live">Pass</span></div></div></section>`}
function research(){return `${head('Experiment operations','Research Workspace','Organize cohorts, model runs, figures and analysis notes for a reproducible research workflow.','Project workspace · local demonstration')}<section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>Experiment board</h2><p>Current research activity</p></div><button class="primary" id="newExperiment">New experiment</button></div><div class="task-board"><div class="task-col"><h3>Planned</h3><div class="task"><b>External cohort validation</b><span>Independent ALS dataset</span></div><div class="task"><b>Proteomic encoder</b><span>Level 4 intensity matrix</span></div></div><div class="task-col"><h3>In analysis</h3><div class="task"><b>Batch-aware normalization</b><span>miRNA sequencing batches</span></div><div class="task"><b>Subgroup evaluation</b><span>Onset type and sex</span></div></div><div class="task-col"><h3>Complete</h3><div class="task"><b>Repeated cross-validation</b><span>5 folds × 3 repeats</span></div><div class="task"><b>CNN attribution</b><span>Gradient SHAP</span></div></div></div></div><div class="grid"><div class="card panel"><div class="panel-head"><div><h2>Saved cohorts</h2><p>Reusable participant selections</p></div></div><div class="source-row"><div><strong>ALS vs control</strong><span>356 participants · baseline miRNA</span></div><button class="control">Open</button></div><div class="source-row"><div><strong>Longitudinal subset</strong><span>22 participants · four visits</span></div><button class="control">Open</button></div><div class="source-row"><div><strong>Integrated demo</strong><span>Representative 360 profiles</span></div><button class="control">Open</button></div></div><div class="card panel"><div class="panel-head"><div><h2>Export library</h2><p>Presentation-ready evidence</p></div></div><div class="source-row"><div><strong>Model validation report</strong><span>Metrics, ROC, confusion matrix</span></div><button class="control">PDF</button></div><div class="source-row"><div><strong>Biomarker table</strong><span>Top 30 miRNA attributions</span></div><button class="control">CSV</button></div></div></div></section>`}
function governance(){return `${head('Trust & provenance','Data Governance','Trace source, transformation, model version and quality status without leaving the workspace.','Audit view · research governance')}<section class="grid two"><div class="card panel"><div class="panel-head"><div><h2>Source registry</h2><p>Datasets represented in the workspace</p></div></div><div class="source-row"><div><strong>GSE168714</strong><span>Public GEO · plasma miRNA · demonstrated experiment</span></div><span class="pill live">Verified</span></div><div class="source-row"><div><strong>Integrated 360 cohort</strong><span>Representative linked molecular and clinical records</span></div><span class="pill demo">Demo data</span></div><div class="source-row"><div><strong>Target multi-omics cohort</strong><span>Genomics, proteomics and clinical sequence contract</span></div><span class="pill plan">Planned</span></div></div><div class="card panel"><div class="panel-head"><div><h2>Quality controls</h2><p>Current pipeline status</p></div></div><div class="quality-grid"><div class="quality"><div class="quality-head"><b>ID uniqueness</b><span>100%</span></div><div class="bar"><span style="width:100%"></span></div></div><div class="quality"><div class="quality-head"><b>Split integrity</b><span>100%</span></div><div class="bar"><span style="width:100%"></span></div></div><div class="quality"><div class="quality-head"><b>Feature mapping</b><span>98%</span></div><div class="bar"><span style="width:98%;background:var(--blue)"></span></div></div><div class="quality"><div class="quality-head"><b>Visit chronology</b><span>96%</span></div><div class="bar"><span style="width:96%;background:var(--violet)"></span></div></div></div></div></section><section class="grid three" style="margin-top:16px"><div class="card panel"><div class="panel-head"><div><h2>Model card</h2><p>ALS-HybriNet v3</p></div></div><div class="clinical-list"><div class="clinical-item"><span>Framework</span><b>PyTorch</b></div><div class="clinical-item"><span>Task</span><b>ALS classification</b></div><div class="clinical-item"><span>Threshold</span><b>0.694</b></div><div class="clinical-item"><span>Last trained</span><b>Sep 2026</b></div></div></div><div class="card panel"><div class="panel-head"><div><h2>Intended use</h2><p>Research scope</p></div></div><div class="insight">Exploratory biomarker research, architecture evaluation and cohort-level analysis. Outputs support research interpretation and are not clinical decisions.</div></div><div class="card panel"><div class="panel-head"><div><h2>Audit trail</h2><p>Latest checks</p></div></div><div class="activity-row"><div class="activity-icon">✓</div><div><strong>Test split locked</strong><span>Random seed 42</span></div><span>Pass</span></div><div class="activity-row"><div class="activity-icon">✓</div><div><strong>Outputs reproduced</strong><span>Model v3.0</span></div><span>Pass</span></div></div></section>`}
const views={overview,patient,cohort,omics,timeline,diagnostics,explain,validation,research,governance};
function render(){document.getElementById('content').innerHTML=views[state.view]();bind();window.scrollTo({top:0,behavior:'smooth'})}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function navigate(v){state.view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('sidebar').classList.remove('open');render()}
function bind(){document.querySelectorAll('.jump').forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.querySelectorAll('[data-omic]').forEach(b=>b.onclick=()=>{state.omic=b.dataset.omic;render()});const gf=document.getElementById('groupFilter');if(gf)gf.onchange=()=>{const vals=gf.value==='als'?['253','253 ALS cases']:gf.value==='control'?['103','103 healthy controls']:['356','253 ALS · 103 controls'];document.getElementById('cohortN').textContent=vals[0];document.getElementById('cohortMix').textContent=vals[1]};['saveCohort','downloadTable','newExperiment'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=()=>showToast(id==='saveCohort'?'Cohort saved to workspace':id==='downloadTable'?'Biomarker table prepared':'New experiment created')});document.querySelectorAll('[data-node]').forEach(n=>n.onclick=()=>{document.querySelectorAll('[data-node]').forEach(x=>x.classList.remove('selected'));n.classList.add('selected');document.getElementById('nodeTitle').textContent=n.dataset.node});const run=document.getElementById('runAnalysis');if(run)run.onclick=()=>{const p=document.getElementById('runProgress'),l=document.getElementById('runLabel');run.disabled=true;p.className='run-progress running';l.textContent='Encoding available modalities…';setTimeout(()=>{p.className='run-progress done';l.textContent='Analysis complete · score '+patients[state.patient].risk+'%';run.disabled=false;showToast('Demonstration analysis complete')},1400)}}
document.querySelectorAll('#nav button[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('patientSelect').onchange=e=>{state.patient=e.target.value;if(['patient','timeline','diagnostics','explain'].includes(state.view))render();else showToast('Participant '+state.patient+' selected')};
document.getElementById('cohortSelect').onchange=e=>showToast(e.target.value+' selected');
document.getElementById('exportBtn').onclick=()=>window.print();
document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;if(q.toUpperCase().includes('MIR')||q.toUpperCase().includes('GENE')||q.toUpperCase().includes('NEFL'))navigate('omics');else if(q.toUpperCase().includes('AALS')||q.toUpperCase().includes('CTRL'))navigate('patient');else showToast('Search ready for “'+q+'”')}};
render();
</script>
